<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="100" cy="100" r="40" fill="url(#glow)" filter="url(#blur)" opacity="0.6" />
  <!-- Core Spark -->
  <path d="M100 30 C100 80 120 100 170 100 C120 100 100 120 100 170 C100 120 80 100 30 100 C80 100 100 80 100 30 Z" fill="url(#glow)" />
  <!-- Inner Highlight -->
  <path d="M100 60 C100 90 110 100 140 100 C110 100 100 110 100 140 C100 110 90 100 60 100 C90 100 100 90 100 60 Z" fill="#ffffff" opacity="0.8" />
</svg>